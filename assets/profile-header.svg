<svg
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background -->
  <rect
    width="1200"
    height="420"
    rx="16"
    fill="#0D1117"
  />

  <!-- ============================= -->
  <!-- Abstract Pattern -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="white"
    stroke-width="1"
    opacity="0.10"
  >

    <!-- Horizontal flowing lines -->

    <path d="
      M-100 60
      C50 0 150 10 250 90
      C350 170 430 170 530 90
      C630 10 720 20 820 100
      C920 180 1010 180 1110 100
      C1200 30 1270 30 1350 70
    "/>

    <path d="
      M-100 90
      C50 30 160 40 270 120
      C370 195 450 195 550 115
      C650 35 740 40 840 120
      C940 200 1030 200 1130 120
      C1210 60 1280 60 1360 100
    "/>

    <path d="
      M-120 120
      C20 60 150 70 280 150
      C390 220 470 220 570 140
      C670 60 760 70 870 150
      C980 230 1060 230 1160 150
      C1250 80 1310 80 1380 120
    "/>

    <path d="
      M-120 150
      C20 90 150 100 290 180
      C400 245 490 245 590 165
      C690 85 780 90 890 175
      C1000 250 1080 250 1180 175
      C1270 110 1330 110 1400 150
    "/>

    <!-- Diagonal pattern -->

    <path d="
      M20 -100
      C130 20 150 90 130 160
      C110 230 150 290 250 370
      C300 410 330 450 350 500
    "/>

    <path d="
      M70 -100
      C180 20 200 90 180 160
      C160 230 200 290 300 370
      C350 410 380 450 400 500
    "/>

    <path d="
      M120 -100
      C230 20 250 90 230 160
      C210 230 250 290 350 370
      C400 410 430 450 450 500
    "/>

    <path d="
      M170 -100
      C280 20 300 90 280 160
      C260 230 300 290 400 370
      C450 410 480 450 500 500
    "/>

    <!-- Lower waves -->

    <path d="
      M-100 280
      C80 210 190 220 310 290
      C430 360 530 360 650 280
      C770 200 870 210 990 290
      C1110 360 1210 360 1340 280
    "/>

    <path d="
      M-100 315
      C80 245 190 255 320 325
      C440 395 540 395 660 315
      C780 235 890 245 1010 325
      C1130 395 1230 395 1360 315
    "/>

    <!-- Fine horizontal lines -->

    <path d="M0 205 H1200"/>
    <path d="M0 225 H1200"/>
    <path d="M0 245 H1200"/>

  </g>


  <!-- ============================= -->
  <!-- Brighter Main Lines -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="white"
    stroke-width="1.2"
    opacity="0.17"
  >

    <path d="
      M-80 40
      C80 -20 170 10 270 90
      C370 170 450 170 550 90
      C650 10 740 20 840 100
      C940 180 1030 180 1130 100
      C1210 40 1270 40 1340 70
    "/>

    <path d="
      M-80 200
      C80 120 190 130 310 210
      C430 290 520 290 640 210
      C760 130 850 130 970 210
      C1090 290 1180 290 1320 200
    "/>

  </g>


  <!-- ============================= -->
  <!-- Connection Nodes -->
  <!-- ============================= -->

  <g fill="white" opacity="0.35">

    <circle cx="270" cy="90" r="2"/>
    <circle cx="550" cy="90" r="2"/>
    <circle cx="840" cy="100" r="2"/>
    <circle cx="1130" cy="100" r="2"/>

    <circle cx="310" cy="210" r="2"/>
    <circle cx="640" cy="210" r="2"/>
    <circle cx="970" cy="210" r="2"/>

  </g>


  <!-- ============================= -->
  <!-- Node Rings -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="white"
    stroke-width="1"
    opacity="0.08"
  >

    <circle cx="270" cy="90" r="9"/>
    <circle cx="550" cy="90" r="9"/>
    <circle cx="840" cy="100" r="9"/>

    <circle cx="310" cy="210" r="9"/>
    <circle cx="640" cy="210" r="9"/>
    <circle cx="970" cy="210" r="9"/>

  </g>


  <!-- ============================= -->
  <!-- TEXT CONTENT -->
  <!-- ============================= -->

  <g>

    <!-- Small intro -->

    <text
      x="100"
      y="175"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      opacity="0.65"
    >
      Hi, I'm
    </text>


    <!-- Name -->

    <text
      x="100"
      y="220"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="700"
    >
      Arendu Chanda
    </text>


    <!-- Role -->

    <text
      x="100"
      y="258"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="20"
      opacity="0.85"
    >
      Senior Flutter Developer · Mobile Engineer · Product Builder
    </text>


    <!-- Description -->

    <text
      x="100"
      y="300"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      opacity="0.55"
    >
      Building scalable, production-ready applications with Flutter &amp; Dart.
    </text>

  </g>


  <!-- ============================= -->
  <!-- Bottom subtle line -->
  <!-- ============================= -->

  <line
    x1="100"
    y1="340"
    x2="500"
    y2="340"
    stroke="white"
    stroke-width="1"
    opacity="0.12"
  />

</svg>
