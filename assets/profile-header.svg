<svg
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background -->
  <rect width="1200" height="420" fill="#0D1117"/>

  <!-- ============================= -->
  <!-- Abstract infinite line system -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity="0.10"
  >

    <!-- Large flowing lines -->

    <path
      d="M-100 80
         C40 10 120 10 220 90
         C320 170 380 170 470 90
         C560 10 650 10 760 90
         C870 170 940 170 1050 90
         C1150 20 1220 20 1320 80"
    />

    <path
      d="M-120 110
         C20 40 120 40 230 120
         C330 195 400 195 490 115
         C590 30 680 30 790 115
         C890 195 960 195 1070 115
         C1170 40 1250 40 1350 110"
    />

    <path
      d="M-140 140
         C10 70 120 70 240 150
         C340 220 410 220 510 140
         C610 60 700 60 810 145
         C910 220 990 220 1090 145
         C1200 70 1270 70 1370 140"
    />

    <path
      d="M-150 170
         C0 100 130 100 250 180
         C350 245 430 245 530 165
         C630 85 720 85 830 170
         C930 245 1010 245 1110 170
         C1210 100 1300 100 1380 170"
    />

    <!-- Diagonal flowing lines -->

    <path
      d="M40 -80
         C120 20 150 80 130 150
         C110 220 150 280 250 360
         C300 400 330 430 350 470"
    />

    <path
      d="M90 -90
         C170 10 200 70 180 140
         C160 210 200 270 300 350
         C350 390 380 430 400 480"
    />

    <path
      d="M140 -100
         C220 0 250 60 230 130
         C210 200 250 260 350 340
         C410 390 430 430 450 490"
    />

    <path
      d="M190 -110
         C270 -10 300 50 280 120
         C260 190 300 250 400 330
         C460 380 480 430 500 500"
    />

    <!-- Secondary geometry -->

    <path
      d="M-100 300
         C80 230 180 230 300 300
         C420 370 520 370 640 290
         C760 210 860 210 980 290
         C1100 370 1200 370 1320 290"
    />

    <path
      d="M-120 330
         C60 260 170 260 290 330
         C410 400 520 400 650 315
         C770 235 880 235 1000 315
         C1120 395 1220 395 1350 315"
    />

    <!-- Fine grid-like lines -->

    <path d="M0 210 H1200"/>
    <path d="M0 230 H1200"/>
    <path d="M0 250 H1200"/>

  </g>


  <!-- ============================= -->
  <!-- Brighter main pattern -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.2"
    opacity="0.18"
  >

    <path
      d="M-80 40
         C100 -30 170 30 260 100
         C350 170 430 170 520 90
         C610 10 690 20 790 100
         C890 180 970 180 1070 100
         C1160 30 1230 30 1300 70"
    />

    <path
      d="M-80 200
         C80 120 180 130 300 210
         C420 290 500 290 620 210
         C740 130 830 130 950 210
         C1070 290 1160 290 1300 200"
    />

  </g>


  <!-- ============================= -->
  <!-- Small connection nodes -->
  <!-- ============================= -->

  <g fill="#FFFFFF" opacity="0.35">

    <circle cx="260" cy="100" r="2"/>
    <circle cx="520" cy="90" r="2"/>
    <circle cx="790" cy="100" r="2"/>
    <circle cx="1070" cy="100" r="2"/>

    <circle cx="300" cy="210" r="2"/>
    <circle cx="620" cy="210" r="2"/>
    <circle cx="950" cy="210" r="2"/>

  </g>


  <!-- ============================= -->
  <!-- Subtle glow around nodes -->
  <!-- ============================= -->

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity="0.08"
  >

    <circle cx="260" cy="100" r="8"/>
    <circle cx="520" cy="90" r="8"/>
    <circle cx="790" cy="100" r="8"/>

    <circle cx="300" cy="210" r="8"/>
    <circle cx="620" cy="210" r="8"/>
    <circle cx="950" cy="210" r="8"/>

  </g>


  <!-- ============================= -->
  <!-- Fade overlay -->
  <!-- ============================= -->

  <defs>

    <linearGradient
      id="fade"
      x1="0"
      y1="0"
      x2="1200"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >

      <stop
        offset="0"
        stop-color="#0D1117"
        stop-opacity="0"
      />

      <stop
        offset="0.55"
        stop-color="#0D1117"
        stop-opacity="0.25"
      />

      <stop
        offset="1"
        stop-color="#0D1117"
        stop-opacity="0.85"
      />

    </linearGradient>

  </defs>

  <rect
    width="1200"
    height="420"
    fill="url(#fade)"
  />

</svg>
